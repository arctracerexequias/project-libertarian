name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marketplace_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/marketplace_test?sslmode=disable
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: '**/go.sum'
      - run: scripts/test-backend.sh
      - name: Apply full PostGIS migrations, then check rollback and reapply
        shell: bash
        run: |
          for migration in database/migrations/*.up.sql; do
            psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/000007_integrity_and_payment_checkout.down.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/migrations/000007_integrity_and_payment_checkout.up.sql
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/seed.sql
      - name: Validate deployment configuration
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: test
          JWT_SECRET: test
          GATEWAY_SECRET: test
          ADMIN_PASSWORD: test
  mobile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [shared_core, customer_app, provider_app]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true
      - working-directory: mobile/${{ matrix.package }}
        run: |
          flutter pub get
          flutter test
