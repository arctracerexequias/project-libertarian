services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: marketplace
    volumes:
      - marketplace-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - marketplace-network

  db-migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./database/migrations:/migrations
    command:
      - -path=/migrations/
      - -database=postgres://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/marketplace?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marketplace-network

  db-seed:
    profiles: [dev]
    image: postgis/postgis:15-3.4
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./database/seed.sql:/seed.sql:ro
    command: ["psql", "-h", "db", "-U", "user", "-d", "marketplace", "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

  api-gateway:
    build: ./api-gateway
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      identity-service:
        condition: service_started
      marketplace-service:
        condition: service_started
    networks:
      - marketplace-network

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

  marketplace-service:
    build:
      context: .
      dockerfile: marketplace-service/Dockerfile
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/marketplace
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network


  communication-service:
    build:
      context: .
      dockerfile: communication-service/Dockerfile
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/marketplace
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/marketplace
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      CHECKOUT_RETURN_URL: ${CHECKOUT_RETURN_URL:-http://localhost:8080/api/v1/payment/checkout/return}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

  admin-service:
    build: ./admin-service
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/marketplace
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

  dispatch-service:
    build:
      context: .
      dockerfile: dispatch-service/Dockerfile
    environment:
      GATEWAY_SECRET: ${GATEWAY_SECRET:?Set GATEWAY_SECRET in .env}
      DATABASE_URL: postgres://user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/marketplace
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks:
      - marketplace-network

networks:
  marketplace-network:
    driver: bridge

volumes:
  marketplace-data:
